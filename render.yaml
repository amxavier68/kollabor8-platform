services:
  - type: web
    name: k8-platform-staging
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    previews:
      generation: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: K8_ENVIRONMENT
        value: staging
      - key: MONGO_URI
        sync: false
      - key: MONGODB_DB
        value: k8_platform_staging
      - key: K8_API_KEY
        sync: false
      - key: ALLOW_IN_MEMORY_STORE
        value: "false"
      - key: ALLOW_EPHEMERAL_MUTATIONS
        value: "false"

  - type: cron
    name: k8-daily-intelligence-scheduler
    runtime: node
    plan: starter
    region: oregon
    branch: main
    schedule: "0 20 * * 0-4"
    buildCommand: npm install
    startCommand: node scripts/enqueue-daily-briefing.js
    autoDeployTrigger: checksPass
    envVars:
      - key: K8_PLATFORM_URL
        sync: false
      - key: K8_API_KEY
        sync: false
      - key: K8_ORGANISATION_ID
        value: org_kollabor8
      - key: K8_ENVIRONMENT
        value: staging
