services:
  - type: web
    name: k8-platform-staging
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    previews:
      generation: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: K8_ENVIRONMENT
        value: staging
      - key: MONGO_URI
        sync: false
      - key: MONGODB_DB
        value: k8_platform_staging
      - key: K8_API_KEY
        sync: false
      - key: ALLOW_IN_MEMORY_STORE
        value: "false"
      - key: ALLOW_EPHEMERAL_MUTATIONS
        value: "false"
