name: K8 Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "foundation/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Foundation contract and runtime checks
        run: npm run check

