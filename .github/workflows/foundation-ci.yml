name: K8 Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "foundation/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Foundation contract and runtime checks
        run: npm run check

      - name: Backend install
        working-directory: ./backend
        run: npm install

      - name: Backend type check
        working-directory: ./backend
        run: npm run type-check

      - name: Frontend install
        working-directory: ./frontend
        run: npm install

      - name: Frontend build
        working-directory: ./frontend
        run: npm run build
