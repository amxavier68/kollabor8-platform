name: K8 Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "foundation/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax and runtime tests
        run: npm run check

      - name: Validate JSON schemas parse
        run: |
          node -e "for (const f of ['business-context.schema.json','skill.schema.json','pulse-event.schema.json','atlas-evidence.schema.json','workforce-seat.schema.json','workforce-agent.schema.json']) JSON.parse(require('fs').readFileSync('schemas/'+f,'utf8')); console.log('schemas parse: ok')"
